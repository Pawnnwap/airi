    <script>
      ;(function () {
        // ── Sovereign first-run bootstrap ────────────────────────────────
        // This stage is the body of a local companion whose mind runs on
        // 127.0.0.1 (llama.cpp :8081, whisper :8084, core :8700). A fresh
        // browser profile would otherwise show the generic cloud onboarding
        // and block the stage. Seed the local-first defaults ONCE, before
        // the app bundle reads them, so she is simply THERE on first open.
        // Nothing here is a secret: the API token still gates every call.
        var KEY_DONE = 'onboarding/completed'
        var KEY_SKIPPED = 'onboarding/skipped'
        var KEY_ONCE = 'sovereign/seeded-v1'
        // never seed on a hosted deployment — this bootstrap is for the
        // self-hosted stage opened by the launcher on this machine only
        var host = location.hostname
        if (host !== 'localhost' && host !== '127.0.0.1')
          return
        if (localStorage.getItem(KEY_DONE) === 'true' || sessionStorage.getItem(KEY_ONCE))
          return

        // carry the core token handed over by the launcher (?token=…)
        var q = new URLSearchParams(location.search).get('token')
        if (q) localStorage.setItem('sovereign_token', q)

        // synchronous defaults so the very first render is already configured
        var providers = {
          'openai-compatible': {
            id: 'openai-compatible', definitionId: 'openai-compatible',
            config: { api: 'chat-completions', baseUrl: 'http://127.0.0.1:8081/v1', apiKey: 'sk-local' },
            status: 'configured', configuredBy: 'user',
          },
          'openai-compatible-audio-transcription': {
            id: 'openai-compatible-audio-transcription', definitionId: 'openai-compatible-audio-transcription',
            config: { baseUrl: 'http://127.0.0.1:8084/v1', apiKey: 'sk-local-whisper', model: 'whisper-1' },
            status: 'configured', configuredBy: 'user',
          },
        }
        localStorage.setItem('settings/providers/configured', JSON.stringify(providers))
        localStorage.setItem('settings/providers/added', JSON.stringify({
          'openai-compatible': true, 'openai-compatible-audio-transcription': true,
        }))
        localStorage.setItem('settings/consciousness/active-provider', 'openai-compatible')
        localStorage.setItem('settings/speech/active-provider', 'kokoro-local')
        localStorage.setItem('settings/speech/active-model', 'kokoro-82m')
        localStorage.setItem('settings/speech/voice', 'af_heart')
        localStorage.setItem('settings/hearing/active-provider', 'openai-compatible-audio-transcription')
        localStorage.setItem(KEY_DONE, 'true')
        localStorage.setItem(KEY_SKIPPED, 'true')

        // async refinement: pin the exact local chat model id, then one
        // reload so stores read the final values (guarded against loops)
        sessionStorage.setItem(KEY_ONCE, '1')
        fetch('http://127.0.0.1:8081/v1/models')
          .then(r => r.json())
          .then((d) => {
            var id = d && d.data && d.data[0] && d.data[0].id
            if (id && id !== 'default') {
              localStorage.setItem('settings/consciousness/active-model', id)
              location.reload()
            }
          })
          .catch(() => {})
      })()
    </script>
