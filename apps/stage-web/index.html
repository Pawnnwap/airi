    <script>

        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'

    <script>
      ;(function () {
        // Sovereign local-first ensure: runs on EVERY page load, localhost
        // only, purely synchronous and idempotent. The stage is the body of
        // a companion whose mind runs on this machine (llama.cpp :8081,
        // whisper :8084, core :8700); this guarantees the app never boots
        // into "no provider/model" or the cloud onboarding, regardless of
        // browser profile state or interrupted earlier seeds. It only fills
        // gaps and repairs our own entries — user changes are respected.
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1')
          return
        var ls = window.localStorage
        function ensure(key, value) {
          var cur = ls.getItem(key)
          if (cur === null || cur === '' || cur === 'null' || cur === 'undefined')
            ls.setItem(key, value)
        }
        function ensureProvider(id, config) {
          var raw = ls.getItem('settings/providers/configured')
          var cfg = {}
          try { cfg = raw ? JSON.parse(raw) : {} } catch (e) { cfg = {} }
          var entry = cfg[id]
          if (!entry || !entry.config || entry.config.baseUrl !== config.baseUrl) {
            cfg[id] = { id: id, definitionId: id, config: config,
                        status: 'configured', configuredBy: 'user' }
          }
          else if (entry.status !== 'configured') {
            entry.status = 'configured'   // repair: /v1/models probe 404s on llama.cpp
          }
          ls.setItem('settings/providers/configured', JSON.stringify(cfg))
          var added = {}
          try { added = JSON.parse(ls.getItem('settings/providers/added') || '{}') } catch (e) {}
          added[id] = true
          ls.setItem('settings/providers/added', JSON.stringify(added))
        }
        // token handed over by the launcher (?token=…)
        var q = new URLSearchParams(location.search).get('token')
        if (q) ls.setItem('sovereign_token', q)
        // chat: local llama.cpp. It serves one model and ignores the model
        // field, so 'default' is always valid; a real id, once pinned
        // (settings UI), is preserved by ensure().
        ensureProvider('openai-compatible', {
          api: 'chat-completions', baseUrl: 'http://127.0.0.1:8081/v1', apiKey: 'sk-local' })
        ensureProvider('openai-compatible-audio-transcription', {
          baseUrl: 'http://127.0.0.1:8084/v1', apiKey: 'sk-local-whisper', model: 'whisper-1' })
        ensure('settings/consciousness/active-provider', 'openai-compatible')
        ensure('settings/consciousness/active-model', 'default')
        ensure('settings/speech/active-provider', 'kokoro-local')
        ensure('settings/speech/active-model', 'kokoro-82m')
        ensure('settings/speech/voice', 'af_heart')
        ensure('settings/hearing/active-provider', 'openai-compatible-audio-transcription')
        ensure('onboarding/completed', 'true')
        ensure('onboarding/skipped', 'true')
      })()
    </script>
